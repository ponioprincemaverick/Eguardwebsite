  <style>
    :root {
      color-scheme: dark;
      --bg: #07152B;
      --surface: #0C1F3D;
      --surface-2: #112A50;
      --ink: #EAF1FB;
      --ink-2: #A9B8CE;
      --ink-3: #8193AC;
      --line: #1F3659;
      --blue: #4C8DFF;

      --ok: #34C77B;
      --alert: #FF5E52;
      --max: 1180px;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;

    img { max-width: 100%; display: block; }
    a { color: inherit; }

    .wide { font-stretch: 125%; font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; }

    .btn {

      font: inherit; font-weight: 700; font-size: 15px;
      padding: 13px 22px; border-radius: 999px; border: 1.5px solid transparent;
      text-decoration: none; cursor: pointer;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn-sm { padding: 9px 16px; font-size: 13px; }
    .btn-primary { background: var(--amber); color: var(--on-amber); }
    .btn-primary:hover { background: var(--amber-hover); }
    .btn-outline { border-color: var(--ink); color: var(--ink); background: transparent; }
    .btn-outline:hover { background: var(--ink); color: var(--bg); }
    .btn-dark { background: var(--blue); color: #fff; }
    .btn-dark:hover { background: #6AA1FF; }
    .btn-danger { background: rgba(255, 94, 82, 0.16); color: #FF938B; border-color: rgba(255, 94, 82, 0.5); }
    .btn-danger:hover { background: var(--alert); color: #fff; }

    /* Header */
    .site-header {

      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .site-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-stretch: 125%; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
    .logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); border: 1px solid #2A4777; display: grid; place-items: center; flex-shrink: 0; }
    .main-nav { display: flex; gap: 28px; }
    .main-nav a { text-decoration: none; font-weight: 500; font-size: 15px; color: var(--ink-2); }
    .main-nav a:hover { color: var(--ink); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .header-actions .btn { padding: 10px 18px; font-size: 14px; }
    .menu-btn {
      display: none; width: 42px; height: 42px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface); cursor: pointer;
      align-items: center; justify-content: center; color: var(--ink);
    }

    /* Hero */
    .hero { padding: 72px 0 96px; background: radial-gradient(ellipse 70% 60% at 85% 30%, rgba(76, 141, 255, 0.20), transparent 70%), radial-gradient(ellipse 50% 50% at 0% 100%, rgba(76, 141, 255, 0.08), transparent 70%); }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-note { margin-top: 32px; font-size: 14px; color: var(--ink-3); display: flex; align-items: center; gap: 10px; }
    .hero-note::before { content: ""; width: 28px; height: 2px; background: var(--amber); flex-shrink: 0; }

    /* Hero photo */
    .hero-photo {
      border-radius: 24px; overflow: hidden; aspect-ratio: 5 / 4;
      border: 1px solid #2B4878; background: var(--surface-2);

    }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }

    .section-head p { margin-top: 16px; color: var(--ink-2); font-size: 18px; }
    .band { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

    .watch-list { list-style: none; border-top: 1px solid var(--line); }
    .watch-list li { display: grid; grid-template-columns: 52px 1fr; gap: 20px; padding: 28px 0; border-bottom: 1px solid var(--line); }
    .watch-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--blue-soft); display: grid; place-items: center; color: var(--blue); }
    .watch-list h3 { font-size: 20px; font-weight: 700; }
    .watch-list p { color: var(--ink-2); margin-top: 4px; max-width: 34em; }
    .watch-list .example { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--amber); background: rgba(242, 176, 30, 0.12); border-radius: 6px; padding: 3px 10px; }
